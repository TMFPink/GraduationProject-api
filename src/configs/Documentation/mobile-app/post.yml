openapi: 3.0.0
info:
  title: Post Service
  version: 1.0.0
  description: API endpoints for post management with thumbnail upload support

paths:
  /posts:
    get:
      summary: Get all posts
      description: Retrieve paginated list of all posts
      tags: [Post]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of posts per page
      responses:
        '200':
          description: Posts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'All posts fetched successfully'
                  metadata:
                    $ref: '#/components/schemas/PaginatedPosts'

    post:
      summary: Create a new post
      description: Create a new post with optional thumbnail upload
      tags: [Post]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - content
              properties:
                thumbnail:
                  type: string
                  format: binary
                  description: Thumbnail image file (JPEG, PNG, WebP, max 10MB)
                title:
                  type: string
                  example: 'My Amazing Card Collection'
                content:
                  type: string
                  example: 'Check out my latest Yu-Gi-Oh! cards...'
                media_url:
                  type: string
                  format: uri
                  example: 'https://example.com/media.jpg'
                tags:
                  type: string
                  example: 'yugioh,collection,rare'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Post created successfully'
                  metadata:
                    $ref: '#/components/schemas/Post'
        '400':
          description: Bad request - Invalid file type or missing required fields
        '401':
          description: Unauthorized

  /posts/{id}:
    put:
      summary: Update a post
      description: Update an existing post with optional thumbnail change
      tags: [Post]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Post ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                thumbnail:
                  type: string
                  format: binary
                  description: New thumbnail image file (JPEG, PNG, WebP, max 10MB)
                title:
                  type: string
                content:
                  type: string
                media_url:
                  type: string
                  format: uri
                tags:
                  type: string
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Post updated successfully'
                  metadata:
                    $ref: '#/components/schemas/Post'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Post not found or not authorized

    delete:
      summary: Delete a post
      description: Delete a post (only owner can delete)
      tags: [Post]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Post deleted successfully'

  /posts/{id}/upvote:
    post:
      summary: Upvote a post
      tags: [Post]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Upvote successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  metadata:
                    $ref: '#/components/schemas/Post'

  /posts/{id}/downvote:
    post:
      summary: Downvote a post
      tags: [Post]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Downvote successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  metadata:
                    $ref: '#/components/schemas/Post'

  /posts/user/{id}:
    get:
      summary: Get posts by user
      description: Retrieve paginated posts created by a specific user
      tags: [Post]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: User posts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User posts fetched successfully'
                  metadata:
                    $ref: '#/components/schemas/PaginatedPosts'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Post:
      type: object
      properties:
        post_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
          example: 'My Amazing Card Collection'
        content:
          type: string
          example: 'Check out my latest Yu-Gi-Oh! cards...'
        thumbnail:
          type: string
          format: uri
          nullable: true
          example: 'https://your-domain.com/thumbnails/post-id_uuid.jpg'
        media_url:
          type: string
          format: uri
          nullable: true
        tags:
          type: string
          nullable: true
        upvotes:
          type: integer
          example: 42
        downvotes:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        User:
          type: object
          properties:
            user_id:
              type: string
              format: uuid
            username:
              type: string

    PaginatedPosts:
      type: object
      properties:
        total:
          type: integer
          example: 150
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        posts:
          type: array
          items:
            $ref: '#/components/schemas/Post'
