openapi: 3.0.0
info:
  title: User Cards API
  version: 1.0.0
  description: API documentation for managing user cards.

servers:
  - url: http://localhost:3000/api

paths:
  /users/{userId}/cards:
    get:
      summary: Get all cards for a user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: ID of the user
      responses:
        "200":
          description: A list of user cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
    post:
      summary: Create a new card for a user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: ID of the user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardInput"
      responses:
        "201":
          description: Card created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"

  /users/{userId}/cards/{cardId}:
    get:
      summary: Get a specific card for a user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: path
          name: cardId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Card details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          description: Card not found

    delete:
      summary: Delete a specific card for a user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: path
          name: cardId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Card deleted

components:
  schemas:
    Card:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        cardNumber:
          type: string
        cardType:
          type: string
        expiryDate:
          type: string
          format: date
      required:
        - id
        - userId
        - cardNumber
        - cardType
        - expiryDate

    CardInput:
      type: object
      properties:
        cardNumber:
          type: string
        cardType:
          type: string
        expiryDate:
          type: string
          format: date
      required:
        - cardNumber
        - cardType
        - expiryDate
