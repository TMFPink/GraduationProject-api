openapi: 3.0.0
info:
  title: Card Service
  version: 1.1.0
  description: API endpoints for card management across different domains (Yu-Gi-Oh! and Pokémon)

tags:
  - name: Card
    description: Endpoints for retrieving card data

paths:
  /cards:
    get:
      summary: Get all cards
      description: Retrieve a paginated list of cards, with optional search by name.
      tags: [Card]
      parameters:
        - in: query
          name: domain
          schema:
            type: string
            enum: [ygo, pkm, rb]
            example: ygo
          description: 'Domain to filter cards (default: ygo)'
        - in: query
          name: page
          schema:
            type: integer
            example: 1
          description: 'Page number (default: 1)'
        - in: query
          name: limit
          schema:
            type: integer
            example: 20
          description: 'Number of cards per page (default: 20)'
        - in: query
          name: search
          schema:
            type: string
            example: Blue-Eyes
          description: 'Filter cards by name'
      responses:
        '200':
          description: List of cards with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cards retrieved successfully
                  metadata:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 12456
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 20
                      cards:
                        type: array
                        items:
                          $ref: '#/components/schemas/Card'

  /cards/{id}:
    get:
      summary: Get a single card by ID
      description: Retrieve full details of a specific card, including all image variants.
      tags: [Card]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: 'Card ID (UUID)'
      responses:
        '200':
          description: Card details
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Card retrieved successfully
                  metadata:
                    $ref: '#/components/schemas/Card'

  /cards/meta-data:
    get:
      summary: Filter cards by meta data fields
      description: >
        Query cards by one or multiple meta_data fields.
        Examples:
          - `/cards/meta-data?domain=ygo&attribute=Dark&race=Dragon`
          - `/cards/meta-data?domain=pkm&hp=120&types=Fire`
      tags: [Card]
      parameters:
        - in: query
          name: domain
          schema:
            type: string
            example: ygo
          description: 'Domain of cards (ygo, pkm, rb)'
        - in: query
          name: page
          schema:
            type: integer
            example: 1
          description: 'Page number (default: 1)'
        - in: query
          name: limit
          schema:
            type: integer
            example: 20
          description: 'Number of cards per page (default: 20)'
        - in: query
          name: filters
          schema:
            type: object
            additionalProperties:
              type: string
          style: form
          explode: true
          description: 'Dynamic meta filters, e.g. ?attribute=Dark&race=Dragon&archetype=Blue-Eyes'
          example:
            attribute: 'LIGHT'
            race: 'Pyro'
            archetype: 'Ryzeal'
            type: 'Effect Monster'
      responses:
        '200':
          description: Filtered list of cards based on meta_data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cards retrieved by meta data successfully
                  metadata:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 300
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 20
                      filters:
                        type: object
                        example:
                          attribute: Dark
                          race: Dragon
                      cards:
                        type: array
                        items:
                          $ref: '#/components/schemas/Card'

components:
  schemas:
    Card:
      type: object
      properties:
        card_id:
          type: string
          example: 8a1b33c6-7f3e-4a7a-bb02-93a2d09c9c4e
        name:
          type: string
          example: Blue-Eyes White Dragon
        rarity:
          type: string
          example: Ultra Rare
        image_normal_url:
          type: string
          example: https://cdn.example.com/low_resolution/46986414.jpg
        image_large_url:
          type: string
          example: https://cdn.example.com/original/46986414.jpg
        image_thumb_url:
          type: string
          example: https://cdn.example.com/cropped/46986414.jpg
        meta_data:
          oneOf:
            - $ref: '#/components/schemas/YGO_MetaData'
            - $ref: '#/components/schemas/PKM_MetaData'
        images:
          type: array
          items:
            $ref: '#/components/schemas/CardImage'

    CardBasic:
      type: object
      properties:
        card_id:
          type: string
        name:
          type: string
        image_thumb_url:
          type: string

    CardImage:
      type: object
      properties:
        card_image_id:
          type: string
        image_url:
          type: string
          example: https://cdn.example.com/low_resolution/46986414.jpg
        image_url_small:
          type: string
          example: https://cdn.example.com/original/46986414.jpg
        image_url_cropped:
          type: string
          example: https://cdn.example.com/cropped/46986414.jpg
        is_default:
          type: boolean
          example: true

    # ----------------------------
    # Yu-Gi-Oh! Metadata Model
    # ----------------------------
    YGO_MetaData:
      type: object
      description: Metadata structure for Yu-Gi-Oh! cards
      properties:
        type:
          type: string
          example: Effect Monster
        desc:
          type: string
          example: This monster can destroy your opponent’s card when summoned.
        atk:
          type: integer
          example: 2500
        def:
          type: integer
          example: 2000
        level:
          type: integer
          example: 6
        race:
          type: string
          example: Spellcaster
        attribute:
          type: string
          example: DARK
        archetype:
          type: string
          example: Dark Magician

    # ----------------------------
    # Pokémon Metadata Model
    # ----------------------------
    PKM_MetaData:
      type: object
      description: Metadata structure for Pokémon cards
      properties:
        id:
          type: string
          example: swsh7-25
        name:
          type: string
          example: Pikachu
        hp:
          type: integer
          example: 60
        types:
          type: array
          items:
            type: string
          example: ['Electric']
        stage:
          type: string
          example: Basic
        abilities:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: Static
              text:
                type: string
                example: Prevent all damage done by attacks during your opponent’s next turn.
        attacks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: Thunderbolt
              cost:
                type: array
                items:
                  type: string
                example: ['Electric', 'Colorless']
              damage:
                type: string
                example: 90
              text:
                type: string
                example: Discard all Energy from this Pokémon.
        retreat:
          type: integer
          example: 1
        rarity:
          type: string
          example: Rare Holo
        set:
          type: string
          example: Sword & Shield – Evolving Skies
        set_id:
          type: string
          example: swsh7
        series:
          type: string
          example: Sword & Shield
        dexId:
          type: array
          items:
            type: integer
          example: [25]
        illustrator:
          type: string
          example: Mitsuhiro Arita
        variants:
          type: object
          additionalProperties: true
        regulationMark:
          type: string
          example: E

    # ----------------------------
    # Riftbound Metadata Model
    # ----------------------------
    Riftbound_MetaData:
      type: object
      description: Metadata structure for Riftbound cards
      properties:
        source_id:
          type: string
          example: 12345
        name:
          type: string
          example: Riftbound Warrior
        type:
          type: string
          example: Creature
        super:
          type: string
          example: Legendary
        description:
          type: string
          example: A powerful warrior from the Riftbound realm.
        energy:
          type: integer
          example: 5
        might:
          type: integer
          example: 8
        power:
          type: integer
          example: 10
        tags:
          type: array
          items:
            type: string
          example: ['Warrior', 'Legendary']
        colors:
          type: array
          items:
            type: object
            properties:
              colorId:
                type: string
                example: c1
              name:
                type: string
                example: Red
              hexCode:
                type: string
                example: #FF0000
        variants_count:
          type: integer
          example: 3
        variants_summary:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: v1
              variantNumber:
                type: integer
                example: 1
              rarity:
                type: string
                example: Rare
              imageUrl:
                type: string
                example: https://cdn.example.com/original/v1.jpg
              setName:
                type: string
                example: Riftbound Set 1
              releaseDate:
                type: string
                format: date
                example: 2023-01-01
