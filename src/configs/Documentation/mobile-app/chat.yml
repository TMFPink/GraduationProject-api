openapi: 3.0.0
info:
  title: Chat Service
  version: 1.1.0
  description: API endpoints for user-to-user chat and message history

paths:
  /chat/list:
    get:
      summary: Get all chat conversations for the current user
      tags: [Chat]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Chat list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  metadata:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatSummary'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /chat/{receiver_id}:
    get:
      summary: Get chat history between current user and another user
      tags: [Chat]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: receiver_id
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the user to get chat history with
      responses:
        '200':
          description: Chat history loaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  metadata:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '404':
          description: Receiver not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /chat/{receiver_id}/read:
    patch:
      summary: Mark all messages from a specific user as read
      tags: [Chat]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: receiver_id
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the sender whose messages will be marked as read
      responses:
        '200':
          description: Messages marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  updated:
                    type: integer
                    example: 5
        '404':
          description: Receiver not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ChatSummary:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: The other user in this conversation
        first_name:
          type: string
        last_message:
          type: string
          example: Hey, how are you?
        last_message_time:
          type: string
          format: date-time
        unread_count:
          type: integer
          example: 2

    Message:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        receiver_id:
          type: string
          format: uuid
        content:
          type: string
        is_read:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        code:
          type: integer
          example: 404
        message:
          type: string
          example: Receiver not found
