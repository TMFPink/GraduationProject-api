openapi: 3.0.0
info:
  title: User Service
  version: 1.0.0
  description: API endpoints for user management

paths:
  /users:
    get:
      summary: Get all users
      description: Get list of users based on current user's role (admin sees all, users see other users excluding blocked ones)
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Users retrieved successfully'
                  metadata:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserBasic'
        '400':
          description: Bad request - requesting user is required
        '401':
          description: Unauthorized
    post:
      summary: Create new user (admin only)
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User created successfully'
                  metadata:
                    $ref: '#/components/schemas/User'

  /users/me:
    get:
      summary: Get current user's profile
      description: Returns the authenticated user's profile details including avatar
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully retrieved current user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User retrieved successfully'
                  metadata:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized - Missing or invalid token
        '500':
          description: Internal server error

    put:
      summary: Update current user's profile
      description: Update authenticated user's profile information including avatar upload
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Avatar image file (JPEG, PNG, WebP, max 5MB)
                cover:
                  type: string
                  format: binary
                  description: Avatar image file (JPEG, PNG, WebP, max 5MB)
                username:
                  type: string
                  example: 'JohnDoe'
                email:
                  type: string
                  format: email
                  example: 'john.doe@example.com'
                phone_number:
                  type: string
                  example: '+1234567890'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Profile updated successfully'
                  metadata:
                    $ref: '#/components/schemas/User'
        '400':
          description: Bad request - Invalid file type or size
        '401':
          description: Unauthorized

  /users/{id}:
    get:
      summary: Get user details by ID
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User retrieved successfully'
                  metadata:
                    $ref: '#/components/schemas/User'
        '400':
          description: User not found
        '401':
          description: Unauthorized

    put:
      summary: Update user by ID (admin only)
      description: Update any user's profile including avatar upload (admin functionality)
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Avatar image file (JPEG, PNG, WebP, max 5MB)
                cover:
                  type: string
                  format: binary
                  description: Avatar image file (JPEG, PNG, WebP, max 5MB)
                username:
                  type: string
                email:
                  type: string
                  format: email
                phone_number:
                  type: string
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User updated successfully'
                  metadata:
                    $ref: '#/components/schemas/User'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

    delete:
      summary: Delete user by ID (admin only)
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User deleted successfully'
        '400':
          description: Failed to delete user
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'
        username:
          type: string
          example: 'JohnDoe'
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
        phone_number:
          type: string
          example: '+1234567890'
        avatar_url:
          type: string
          format: uri
          nullable: true
          example: 'https://your-domain.com/avatars/user-id_uuid.jpg'
        cover_url:
          type: string
          format: uri
          nullable: true
          example: 'https://your-domain.com/avatars/user-id_uuid.jpg'
        role_id:
          type: string
          format: uuid
        is_active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserBasic:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email

    UserProfile:
      type: object
      properties:
        username:
          type: string
          example: 'JohnDoe'
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
        avatar_url:
          type: string
          format: uri
          nullable: true
          example: 'https://your-domain.com/avatars/user-id_uuid.jpg'
        cover_url:
          type: string
          format: uri
          nullable: true
          example: 'https://your-domain.com/avatars/user-id_uuid.jpg'
        user_id:
          type: string
          format: uuid

    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
        - phone_number
      properties:
        username:
          type: string
          example: 'JohnDoe'
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
        password:
          type: string
          format: password
          example: 'SecurePassword123'
        phone_number:
          type: string
          example: '+1234567890'
        role_name:
          type: string
          enum: [user, admin]
          default: user
