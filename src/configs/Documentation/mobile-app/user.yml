openapi: 3.0.0
info:
  title: User Service
  version: 1.0.0
  description: API endpoints for user management

paths:
  /users:
    get:
      summary: Get all users (admin only)
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  metadata:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'

  /users/me:
    get:
      summary: Get current user's basic info
      description: Returns the authenticated user's basic profile details.
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully retrieved current user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Successfully retrieved user info'
                  metadata:
                    type: object
                    properties:
                      user_id:
                        type: string
                        example: 'a1b2c3d4e5'
                      name:
                        type: string
                        example: 'John Doe'
                      email:
                        type: string
                        example: 'john.doe@example.com'
        '401':
          description: Unauthorized - Missing or invalid token
        '500':
          description: Internal server error

      get:
        summary: Get current user's basic info
        tags: [User]
        security:
          - bearerAuth: []
        responses:
          '200':
            description: Current user info
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message:
                      type: string
                    metadata:
                      type: object
                      properties:
                        name:
                          type: string

  /users/{id}:
    get:
      summary: Get user details by ID
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  metadata:
                    $ref: '#/components/schemas/User'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        user_id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone_number:
          type: string
        role_id:
          type: string
