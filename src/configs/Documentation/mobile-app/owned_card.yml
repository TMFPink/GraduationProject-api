openapi: 3.0.0
info:
  title: Owned Card Service
  version: 1.0.0
  description: API endpoints for managing user's owned cards collection.

tags:
  - name: Owned Card
    description: Manage user's owned cards - add, retrieve, and remove cards from personal collection.
  - name: Feature Card
    description: Manage user's feature cards - cards displayed on the user's profile.

paths:
  /owned-cards:
    post:
      tags: [Owned Card]
      summary: Add a card to owned cards
      description: Add a card to the authenticated user's owned cards collection.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOwnedCardRequest'
      responses:
        '201':
          description: Card added to owned cards successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddOwnedCardResponse'
        '401':
          description: Unauthorized user
        '404':
          description: Card not found

    get:
      tags: [Owned Card]
      summary: Get all owned cards grouped by quantity
      description: Retrieve all cards owned by the authenticated user, grouped by card with quantities, paginated.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            example: 20
          description: Number of unique cards per page
        - name: domain
          in: query
          schema:
            type: string
          description: Filter by card domain ID (optional)
      responses:
        '200':
          description: Owned cards retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOwnedCardsResponse'
        '401':
          description: Unauthorized user

  /owned-cards/{card_id}:
    delete:
      tags: [Owned Card]
      summary: Remove the latest owned card
      description: Remove the most recently added instance of a card from the authenticated user's owned cards collection.
      security:
        - bearerAuth: []
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the card to remove from owned cards
      responses:
        '200':
          description: Card removed from owned cards successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveOwnedCardResponse'
        '401':
          description: Unauthorized user
        '404':
          description: Owned card not found

  /owned-cards/feature:
    get:
      tags: [Feature Card]
      summary: Get user's feature cards
      description: Retrieve the list of feature cards for the authenticated user, ordered by position.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Feature cards retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFeatureCardsResponse'
        '401':
          description: Unauthorized user

    put:
      tags: [Feature Card]
      summary: Set/replace user's feature cards
      description: Set or replace the entire list of feature cards for the authenticated user. This is an atomic operation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFeatureCardsRequest'
      responses:
        '200':
          description: Feature cards updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetFeatureCardsResponse'
        '400':
          description: Bad request (e.g., duplicates, invalid payload)
        '401':
          description: Unauthorized user
        '404':
          description: One or more owned cards not found

  /owned-cards/user:
    get:
      tags: [Owned Card]
      summary: Get owned cards by user ID
      description: Retrieve all cards owned by a specific user, grouped by card with quantities, paginated.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: The ID of the user whose owned cards are being retrieved
        - name: page
          in: query
          schema:
            type: integer
            example: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            example: 20
          description: Number of unique cards per page
      responses:
        '200':
          description: Owned cards retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOwnedCardsResponse'
        '401':
          description: Unauthorized user
        '404':
          description: User not found

components:
  schemas:
    # ---------- Core Models ----------
    OwnedCardGroup:
      type: object
      properties:
        owned_card_ids:
          type: array
          items:
            type: string
          example:
            - '88888888-8888-8888-8888-888888888888'
            - '88888888-8888-8888-8888-888888888889'
        card_id:
          type: string
          example: 33333333-3333-3333-3333-333333333333
        card_domain_id:
          type: string
          example: ygo
        quantity:
          type: integer
          example: 3
          description: Number of copies of this card owned by the user
        Card:
          type: object
          properties:
            card_id:
              type: string
              example: 33333333-3333-3333-3333-333333333333
            name:
              type: string
              example: Blue-Eyes White Dragon
            rarity:
              type: string
              example: Ultra Rare
            image_normal_url:
              type: string
              example: https://example.com/card-image.jpg
            card_type:
              type: string
              example: ygo

    FeatureCard:
      type: object
      properties:
        feature_card_id:
          type: string
          example: '99999999-9999-9999-9999-999999999999'
        position:
          type: integer
          example: 1
        owned_card_id:
          type: string
          example: '88888888-8888-8888-8888-888888888888'
        card:
          type: object
          properties:
            card_id:
              type: string
              example: '33333333-3333-3333-3333-333333333333'
            name:
              type: string
              example: 'Blue-Eyes White Dragon'
            rarity:
              type: string
              example: 'Ultra Rare'
            image_normal_url:
              type: string
              example: 'https://example.com/card-image.jpg'
        card_domain_id:
          type: string
          example: '11111111-1111-1111-1111-111111111111'

    # ---------- Requests ----------
    AddOwnedCardRequest:
      type: object
      required: [card_id, domain]
      properties:
        card_id:
          type: string
          example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
          description: The ID of the card to add to owned cards
        domain:
          type: string
          example: ygo
          description: The domain ID for the card

    RemoveOwnedCardRequest:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
          example: 11111111-1111-1111-1111-111111111111
          description: The domain ID for the card to remove

    SetFeatureCardsRequest:
      type: object
      required: [feature_cards]
      properties:
        feature_cards:
          type: array
          description: An array of feature card objects to set.
          items:
            type: object
            required: [owned_card_id, position]
            properties:
              owned_card_id:
                type: string
                example: '88888888-8888-8888-8888-888888888888'
                description: The ID of the owned card to feature.
              position:
                type: integer
                example: 1
                description: The display order of the feature card.
      example:
        feature_cards:
          - owned_card_id: 'owned-card-uuid-1'
            position: 1
          - owned_card_id: 'owned-card-uuid-2'
            position: 2
          - owned_card_id: 'owned-card-uuid-3'
            position: 3

    # ---------- Responses ----------
    AddOwnedCardResponse:
      type: object
      properties:
        message:
          type: string
          example: Card added to owned cards successfully
        metadata:
          type: object
          properties:
            ownedCard:
              $ref: '#/components/schemas/OwnedCard'

    GetOwnedCardsResponse:
      type: object
      properties:
        message:
          type: string
          example: Owned cards retrieved successfully
        metadata:
          type: object
          properties:
            total:
              type: integer
              example: 25
              description: Total number of unique cards owned
            page:
              type: integer
              example: 1
              description: Current page number
            limit:
              type: integer
              example: 20
              description: Number of unique cards per page
            ownedCards:
              type: array
              items:
                $ref: '#/components/schemas/OwnedCardGroup'

    RemoveOwnedCardResponse:
      type: object
      properties:
        message:
          type: string
          example: Card removed from owned cards successfully

    GetFeatureCardsResponse:
      type: object
      properties:
        message:
          type: string
          example: Feature cards retrieved successfully
        metadata:
          type: object
          properties:
            featureCards:
              type: array
              items:
                $ref: '#/components/schemas/FeatureCard'

    SetFeatureCardsResponse:
      type: object
      properties:
        message:
          type: string
          example: Feature cards updated successfully
        metadata:
          type: object
          properties:
            featureCards:
              type: array
              items:
                type: object
                properties:
                  feature_card_id:
                    type: string
                  user_id:
                    type: string
                  owned_card_id:
                    type: string
                  position:
                    type: integer

  # ---------- Security ----------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
