openapi: 3.0.0
info:
  title: Comment Service
  version: 1.0.0
  description: API endpoints for managing comments and replies on posts

paths:
  /comments:
    post:
      summary: Create a new comment or reply
      description: Create a comment for a post or a reply to another comment.
      tags: [Comment]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                post_id:
                  type: string
                  description: ID of the post to comment on
                content:
                  type: string
                  description: Text content of the comment
                parent_id:
                  type: string
                  nullable: true
                  description: ID of the parent comment (if it's a reply)
      responses:
        '201':
          description: Comment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  metadata:
                    $ref: '#/components/schemas/Comment'

  /comments/post/{post_id}:
    get:
      summary: Get all comments for a post
      description: Retrieve all comments (including replies) for a given post.
      tags: [Comment]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: post_id
          required: true
          schema:
            type: string
          description: ID of the post
      responses:
        '200':
          description: List of comments for the post
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  metadata:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'

  /comments/{id}/upvote:
    post:
      summary: Upvote a comment
      description: Adds an upvote to a comment. Toggles or switches if already voted.
      tags: [Comment]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Comment ID
      responses:
        '200':
          description: Comment upvoted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  metadata:
                    $ref: '#/components/schemas/Comment'

  /comments/{id}/downvote:
    post:
      summary: Downvote a comment
      description: Adds a downvote to a comment. Toggles or switches if already voted.
      tags: [Comment]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Comment ID
      responses:
        '200':
          description: Comment downvoted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  metadata:
                    $ref: '#/components/schemas/Comment'

  /comments/{id}:
    delete:
      summary: Delete a comment
      description: Delete a comment created by the authenticated user.
      tags: [Comment]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Comment ID
      responses:
        '200':
          description: Comment deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Comment:
      type: object
      properties:
        comment_id:
          type: string
        post_id:
          type: string
        user_id:
          type: string
        content:
          type: string
        parent_id:
          type: string
          nullable: true
        upvotes:
          type: integer
        downvotes:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            user_id:
              type: string
            first_name:
              type: string
            avatar:
              type: string
        replies:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
