openapi: 3.0.0
info:
  title: Collection Service
  version: 1.3.0
  description: API endpoints for managing user collections and their cards (no quantity field).

tags:
  - name: Collection
    description: Manage user collections and the cards they contain.

paths:
  /collection/{id}/card:
    post:
      tags: [Collection]
      summary: Add a single card to a collection
      description: Add one card directly to an existing collection by its ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the collection to which the card will be added
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCardToCollectionRequest'
      responses:
        '200':
          description: Card added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddCardToCollectionResponse'
        '400':
          description: Card already exists in collection
        '404':
          description: Collection not found
  /collection:
    post:
      tags: [Collection]
      summary: Create a new collection with cards
      description: Create a new collection, optionally including a list of card IDs.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: Collection created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollectionResponse'

    get:
      tags: [Collection]
      summary: Get all collections for the current user
      description: Retrieve a paginated list of all collections owned by the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Collections retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCollectionsResponse'

  /collection/{id}:
    get:
      tags: [Collection]
      summary: Get collection detail with cards
      description: Retrieve a single collection with its domain and cards.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the collection to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: Collection detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCollectionResponse'

    put:
      tags: [Collection]
      summary: Update collection name, domain, or cards
      description: Replace or update collection details and its list of cards.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the collection to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionRequest'
      responses:
        '200':
          description: Collection updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCollectionResponse'

    delete:
      tags: [Collection]
      summary: Delete a collection
      description: Permanently delete a collection and its associated cards.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the collection to delete.
          schema:
            type: string
      responses:
        '200':
          description: Collection deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCollectionResponse'

components:
  schemas:
    # ---------- Core Models ----------
    Collection:
      type: object
      properties:
        collection_id:
          type: string
          example: 11111111-1111-1111-1111-111111111111
        user_id:
          type: string
          example: 22222222-2222-2222-2222-222222222222
        name:
          type: string
          example: Fire Collection
        card_domain_id:
          type: string
          example: 33333333-3333-3333-3333-333333333333
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- Requests ----------
    CreateCollectionRequest:
      type: object
      required: [name, card_domain_id]
      properties:
        name:
          type: string
          example: Fire Collection
        card_domain_id:
          type: string
          example: 33333333-3333-3333-3333-333333333333
        cards:
          type: array
          description: List of card IDs to include in this collection.
          items:
            type: string
            example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee

    UpdateCollectionRequest:
      type: object
      properties:
        name:
          type: string
          example: Updated Fire Collection
        card_domain_id:
          type: string
          example: 33333333-3333-3333-3333-333333333333
        cards:
          type: array
          description: Replace the existing list of card IDs in this collection.
          items:
            type: string
            example: ffffffff-1111-2222-3333-444444444444

    # ---------- Responses ----------
    CreateCollectionResponse:
      type: object
      properties:
        message:
          type: string
          example: Collection created successfully
        metadata:
          $ref: '#/components/schemas/Collection'

    UpdateCollectionResponse:
      type: object
      properties:
        message:
          type: string
          example: Collection updated successfully
        metadata:
          $ref: '#/components/schemas/Collection'

    GetCollectionsResponse:
      type: object
      properties:
        total:
          type: integer
          example: 5
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'

    GetCollectionResponse:
      type: object
      properties:
        message:
          type: string
          example: Collection retrieved successfully
        metadata:
          $ref: '#/components/schemas/Collection'

    DeleteCollectionResponse:
      type: object
      properties:
        message:
          type: string
          example: Collection deleted successfully
    AddCardToCollectionRequest:
      type: object
      required: [card_id]
      properties:
        card_id:
          type: string
          example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee

    AddCardToCollectionResponse:
      type: object
      properties:
        message:
          type: string
          example: Card added to collection successfully
        metadata:
          type: object
          properties:
            collection_card_id:
              type: string
              example: 99999999-1111-2222-3333-444444444444
            collection_id:
              type: string
              example: 11111111-1111-1111-1111-111111111111
            card_id:
              type: string
              example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee

  # ---------- Security ----------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
