openapi: 3.0.0
info:
  title: Collection Service
  version: 1.3.1
  description: API endpoints for managing user collections and the cards they contain.

tags:
  - name: Collection
    description: Manage user collections and their associated cards.

paths:
  /collections:
    post:
      tags: [Collection]
      summary: Create a new collection with optional cards
      description: Create a new collection for the authenticated user, optionally including a list of card IDs.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: Collection created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollectionResponse'
        '400':
          description: Invalid input (missing name or card_type)
        '401':
          description: Unauthorized user

    get:
      tags: [Collection]
      summary: Get all user collections
      description: Retrieve all collections belonging to the authenticated user, paginated.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            example: 20
          description: Number of collections per page
      responses:
        '200':
          description: Collections retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCollectionsResponse'

  /collections/{collection_id}:
    get:
      tags: [Collection]
      summary: Get collection detail with cards
      description: Retrieve a collection by its ID, including domain and all cards in it.
      security:
        - bearerAuth: []
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the collection to retrieve
      responses:
        '200':
          description: Collection retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCollectionResponse'
        '404':
          description: Collection not found or unauthorized

    put:
      tags: [Collection]
      summary: Update collection name or cards
      description: Update the name of a collection or replace its list of cards entirely.
      security:
        - bearerAuth: []
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionRequest'
      responses:
        '200':
          description: Collection updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCollectionResponse'
        '404':
          description: Collection not found or unauthorized

    delete:
      tags: [Collection]
      summary: Delete a collection
      description: Permanently delete a collection and all its associated cards.
      security:
        - bearerAuth: []
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Collection deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCollectionResponse'
        '404':
          description: Collection not found or unauthorized

  /collections/{collection_id}/cards:
    post:
      tags: [Collection]
      summary: Add a card to an existing collection
      description: Add one specific card to an existing user collection.
      security:
        - bearerAuth: []
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            type: string
          description: Collection ID to which the card will be added
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCardToCollectionRequest'
      responses:
        '200':
          description: Card added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddCardToCollectionResponse'
        '400':
          description: Card already exists in this collection
        '404':
          description: Collection not found or unauthorized

  /collections/user:
    get:
      tags: [Collection]
      summary: Get collections by user ID
      description: Retrieve collections belonging to a specific user, paginated.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            description: The ID of the user whose collections are to be retrieved
        - name: page
          in: query
          schema:
            type: integer
            example: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            example: 20
          description: Number of collections per page
      responses:
        '200':
          description: Collections retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCollectionsResponse'
        '404':
          description: User not found or unauthorized

components:
  schemas:
    # ---------- Core Models ----------
    Collection:
      type: object
      properties:
        collection_id:
          type: string
          example: 11111111-1111-1111-1111-111111111111
        user_id:
          type: string
          example: 22222222-2222-2222-2222-222222222222
        name:
          type: string
          example: Fire Collection
        card_type:
          type: string
          example: ygo
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        domain:
          type: object
          nullable: true
          properties:
            name:
              type: string
              example: Yu-Gi-Oh!
        cards:
          type: array
          items:
            type: object
            properties:
              card_id:
                type: string
              name:
                type: string
              rarity:
                type: string
              image_normal_url:
                type: string

    # ---------- Requests ----------
    CreateCollectionRequest:
      type: object
      required: [name, card_type]
      properties:
        name:
          type: string
          example: Fire Deck
        card_type:
          type: string
          enum: [ygo, pkm, rb]
          example: ygo
        cards:
          type: array
          items:
            type: string
            example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee

    UpdateCollectionRequest:
      type: object
      properties:
        name:
          type: string
          example: Updated Fire Deck
        cards:
          type: array
          items:
            type: string
            example: ffffffff-1111-2222-3333-444444444444

    AddCardToCollectionRequest:
      type: object
      required: [card_id]
      properties:
        card_id:
          type: string
          example: bbbbbbbb-cccc-dddd-eeee-ffffffffffff

    # ---------- Responses ----------
    CreateCollectionResponse:
      type: object
      properties:
        message:
          type: string
          example: Collection created successfully
        metadata:
          type: object
          properties:
            collection:
              $ref: '#/components/schemas/Collection'

    UpdateCollectionResponse:
      type: object
      properties:
        message:
          type: string
          example: Collection updated successfully
        metadata:
          type: object
          properties:
            collection:
              $ref: '#/components/schemas/Collection'

    AddCardToCollectionResponse:
      type: object
      properties:
        message:
          type: string
          example: Card added to collection successfully
        metadata:
          type: object
          properties:
            collection_card_id:
              type: string
              example: 99999999-1111-2222-3333-444444444444
            collection_id:
              type: string
              example: 11111111-1111-1111-1111-111111111111
            card_id:
              type: string
              example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee

    GetCollectionsResponse:
      type: object
      properties:
        message:
          type: string
          example: Collections retrieved successfully
        metadata:
          type: object
          properties:
            total:
              type: integer
              example: 5
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            collections:
              type: array
              items:
                $ref: '#/components/schemas/Collection'

    GetCollectionResponse:
      type: object
      properties:
        message:
          type: string
          example: Collection retrieved successfully
        metadata:
          type: object
          properties:
            collection:
              $ref: '#/components/schemas/Collection'

    DeleteCollectionResponse:
      type: object
      properties:
        message:
          type: string
          example: Collection deleted successfully

  # ---------- Security ----------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
