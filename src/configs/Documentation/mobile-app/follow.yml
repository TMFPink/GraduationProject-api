openapi: 3.0.0
info:
  title: Follow Service
  version: 1.2.0
  description: API endpoints for Follow management across different domains (Yu-Gi-Oh! and Pokémon)

tags:
  - name: Follow
    description: Endpoints for managing and retrieving follow relationships

paths:
  /follow/toggle:
    post:
      tags: [Follow]
      summary: Toggle follow/unfollow a user
      description: |
        Toggle the follow status between the authenticated user and the target user.
        - If not currently following → follow the user.
        - If already following → unfollow the user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - following_id
              properties:
                following_id:
                  type: string
                  example: 22222222-2222-2222-2222-222222222222
      responses:
        '200':
          description: Follow toggled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  isFollowing:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Followed successfully'
        '400':
          description: Bad request (missing following_id)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /follow/{id}/followers:
    get:
      tags: [Follow]
      summary: Get followers of a specific user
      description: Retrieve the list of users who are following a given user by user ID.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: 11111111-1111-1111-1111-111111111111
        - in: query
          name: page
          schema:
            type: integer
            example: 1
        - in: query
          name: limit
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Followers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 50
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  followers:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: string
                        first_name:
                          type: string
                        last_name:
                          type: string
                        email:
                          type: string
        '404':
          description: User not found

  /follow/{id}/following:
    get:
      tags: [Follow]
      summary: Get users that a specific user is following
      description: Retrieve a list of users that a given user follows.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: 11111111-1111-1111-1111-111111111111
        - in: query
          name: page
          schema:
            type: integer
            example: 1
        - in: query
          name: limit
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Following retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 35
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  following:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: string
                        first_name:
                          type: string
                        last_name:
                          type: string
                        email:
                          type: string
        '404':
          description: User not found

  /follow/me/followers:
    get:
      tags: [Follow]
      summary: Get followers of the current authenticated user
      description: Retrieve all users who follow the current logged-in user.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            example: 1
        - in: query
          name: limit
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Followers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  followers:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: string
                        first_name:
                          type: string
                        last_name:
                          type: string
                        email:
                          type: string
        '401':
          description: Unauthorized

  /follow/me/following:
    get:
      tags: [Follow]
      summary: Get users the current authenticated user is following
      description: Retrieve all users that the current logged-in user follows.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            example: 1
        - in: query
          name: limit
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Following retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  following:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: string
                        first_name:
                          type: string
                        last_name:
                          type: string
                        email:
                          type: string
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
