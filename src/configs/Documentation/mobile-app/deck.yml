openapi: 3.0.0
info:
  title: Deck Service
  version: 1.1.0
  description: API endpoints for managing decks and their cards.

tags:
  - name: Deck
    description: Manage user decks and the cards inside them.

paths:
  /deck:
    post:
      tags: [Deck]
      summary: Create a new deck with cards
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeckRequest'
      responses:
        '201':
          description: Deck created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDeckResponse'
        '400':
          description: Bad request - Invalid card type or format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Deck]
      summary: Get all decks of current user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, example: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, example: 20, default: 20 }
      responses:
        '200':
          description: Decks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDecksResponse'

  /deck/{id}:
    get:
      tags: [Deck]
      summary: Get deck details with cards
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deck detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDeckResponse'
        '404':
          description: Deck not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Deck]
      summary: Update deck name, format, or cards
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeckRequest'
      responses:
        '200':
          description: Deck updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDeckResponse'
        '400':
          description: Bad request - Invalid format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Deck not found or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Deck]
      summary: Delete a deck
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deck deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDeckResponse'
        '404':
          description: Deck not found or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Deck:
      type: object
      properties:
        deck_id:
          { type: string, example: '11111111-1111-1111-1111-111111111111' }
        user_id:
          { type: string, example: '22222222-2222-2222-2222-222222222222' }
        name: { type: string, example: 'My Fire Deck' }
        card_type: { type: string, example: 'ygo' }
        format: { type: string, example: 'TCG', nullable: true }
        createdAt: { type: string, format: date-time }

    DeckCard:
      type: object
      properties:
        card_id:
          { type: string, example: 'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee' }
        quantity: { type: integer, example: 2, default: 1 }

    CreateDeckRequest:
      type: object
      required: [name, card_type]
      properties:
        name: { type: string, example: 'My Fire Deck' }
        card_type:
          type: string
          enum: [ygo, pkm, rb]
          example: 'ygo'
          description: "Card type - 'ygo' for Yu-Gi-Oh!, 'pkm' for Pokemon"
        format:
          type: string
          example: 'TCG'
          description: 'Optional format - For ygo: TCG, OCG, Genesys. For pkm: Standard, Expanded, Legacy, Unlimited'
        cards:
          type: array
          description: 'List of card IDs and quantities'
          items:
            $ref: '#/components/schemas/DeckCard'
          default: []

    UpdateDeckRequest:
      type: object
      properties:
        name: { type: string, example: 'Updated Deck Name' }
        format:
          type: string
          example: 'OCG'
          nullable: true
          description: "Format for the deck - must be valid for the deck's card type"
        cards:
          type: array
          description: 'Complete replacement of deck cards'
          items:
            $ref: '#/components/schemas/DeckCard'

    CreateDeckResponse:
      type: object
      properties:
        message: { type: string, example: 'Deck created successfully' }
        deck: { $ref: '#/components/schemas/Deck' }

    UpdateDeckResponse:
      type: object
      properties:
        message: { type: string, example: 'Deck updated successfully' }
        deck: { $ref: '#/components/schemas/Deck' }

    GetDecksResponse:
      type: object
      properties:
        total: { type: integer, example: 3 }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        decks:
          type: array
          items: { $ref: '#/components/schemas/Deck' }

    GetDeckResponse:
      type: object
      properties:
        message: { type: string, example: 'Deck retrieved successfully' }
        deck: { $ref: '#/components/schemas/Deck' }

    DeleteDeckResponse:
      type: object
      properties:
        message: { type: string, example: 'Deck deleted successfully' }

    ErrorResponse:
      type: object
      properties:
        message: { type: string, example: 'Invalid card type' }
        error: { type: string, example: 'BadRequestError' }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
